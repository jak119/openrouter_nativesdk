services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - homeassistant

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
      - ../custom_components/openrouter_nativesdk:/config/custom_components/openrouter_nativesdk:ro
    environment:
      TZ: Etc/UTC
    restart: unless-stopped
