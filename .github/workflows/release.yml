name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a pre-release
        type: boolean
        default: false

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/validate.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    name: Create release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for changelog generation

      - name: Validate and resolve version
        id: version
        run: |
          # CalVer format: YYYY.MM.DD, using the current UTC date.
          BASE="$(date -u '+%Y.%m.%d')"
          TAG_PATTERN='^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          SAME_DAY_PATTERN="^v${BASE//./\\.}(\\.[0-9]+)?$"

          # Use the date as-is for the first release of the day. For later
          # releases, append the next numeric suffix: .1, .2, and so on.
          SAME_DAY_TAGS=$(git tag --list | grep -E "$SAME_DAY_PATTERN" || true)
          if [[ -z "$SAME_DAY_TAGS" ]]; then
            NEW="$BASE"
          else
            MAX_SUFFIX=$(printf '%s\n' "$SAME_DAY_TAGS" | sed -E 's/^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.([0-9]+))?$/\2/' \
              | awk 'BEGIN { max=0 } $1 != "" && $1 > max { max=$1 } END { print max }')
            NEW="$BASE.$((MAX_SUFFIX + 1))"
          fi

          # Only compare against CalVer tags; v0.0.x tags from before this
          # migration are intentionally ignored.
          LATEST_TAG=$(git tag --list | grep -E "$TAG_PATTERN" | sort -V | tail -n1 || true)
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST="${LATEST_TAG#v}"
            # sort -V puts the earlier calendar version first.
            LOWER=$(printf '%s\n%s' "$LATEST" "$NEW" | sort -V | head -n1)
            if [[ "$LOWER" != "$LATEST" || "$NEW" == "$LATEST" ]]; then
              echo "::error::New version '$NEW' must be greater than current '$LATEST'"
              exit 1
            fi
          else
            LATEST_TAG=""
            LATEST="(none)"
          fi

          echo "new=$NEW"           >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"          >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"     >> "$GITHUB_OUTPUT"

      - name: Resolve changelog base
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Pre-releases list changes since the most recent tag of any kind.
          # Full releases list everything since the last full release, so
          # changes first shipped in pre-releases are included.
          if [[ "$PRERELEASE" == "true" ]]; then
            BASE_TAG="${{ steps.version.outputs.latest_tag }}"
          else
            BASE_TAG=$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
              --json tagName --jq '.[].tagName' \
              | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' | sort -V | tail -n1 || true)
          fi
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          NEW_TAG="${{ steps.version.outputs.tag }}"
          LATEST_TAG="${{ steps.base.outputs.tag }}"

          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="$LATEST_TAG..HEAD"
            SINCE_TEXT="since $LATEST_TAG"
          else
            RANGE="HEAD"
            SINCE_TEXT="initial release"
          fi

          # Collect commits: hash (short) + subject, excluding merge commits
          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")

          if [[ -z "$COMMITS" ]]; then
            COMMITS="- No changes recorded"
          fi

          # Write the changelog body to a temp file to preserve newlines
          {
            echo "## What's changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${LATEST_TAG:-$(git rev-list --max-parents=0 HEAD)}...$NEW_TAG"
          } > /tmp/changelog.md

          cat /tmp/changelog.md

      - name: Update manifest.json and pyproject.toml versions
        run: |
          NEW="${{ steps.version.outputs.new }}"
          jq --arg v "$NEW" '.version = $v' \
            custom_components/openrouter_nativesdk/manifest.json \
            > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/openrouter_nativesdk/manifest.json
          sed -i -E "s/^version = \".*\"$/version = \"$NEW\"/" pyproject.toml
          grep -qx "version = \"$NEW\"" pyproject.toml || { echo "::error::Failed to set pyproject.toml version"; exit 1; }

      - name: Commit versions and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add custom_components/openrouter_nativesdk/manifest.json pyproject.toml
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/changelog.md \
            "${FLAGS[@]}"
